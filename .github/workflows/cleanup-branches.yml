name: One-time cleanup (test branches)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-branches.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for b in v1.10-test test-dmg; do
            curl -sS -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/$b" -w "$b %{http_code}\n"
          done
