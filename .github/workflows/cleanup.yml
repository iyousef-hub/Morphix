name: Clean up old 1.7.1 refs (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          git push origin --delete release-1.7.1 || true
          id=$(gh api repos/${{ github.repository }}/releases/tags/v1.7.1 --jq .id)
          gh api -X PATCH repos/${{ github.repository }}/releases/$id -f target_commitish=514bb8465263d008128456fac38b31b77b89aed5 --jq .target_commitish
          git ls-remote origin
