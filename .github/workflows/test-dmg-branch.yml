name: Test builds to branch (temporary)

on:
  push:
    branches: [v1.11-test]

permissions:
  contents: write
  actions: read

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml
  linux:
    uses: ./.github/workflows/build-linux.yml
  copy:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: out
      - name: Push the builds in parts to a temporary branch
        run: |
          cd out
          ls -la
          sha256sum * > SHA256.txt
          for f in *.zip *.AppImage; do split -b 40m -d "$f" "$f.part"; rm "$f"; done
          git init -q
          git config user.name "Yousef"
          git config user.email "279624446+iyousef-hub@users.noreply.github.com"
          git checkout -q -b test-builds
          git add -A
          git commit -q -m "Test builds"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" test-builds
