name: Build macOS

# Builds Morphix.app and Morphix.dmg (Apple Silicon) on a GitHub-hosted Mac.
#  - Every push to main and every manual run: a downloadable "Morphix_macOS" artifact.
#  - A tag such as v1.7.1: the DMG is also attached to the GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-speech.txt

      - name: Install components
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-speech.txt "pyinstaller>=6.10,<7" pytest

      - name: Tests
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: App icon
        run: |
          ICONSET=build_out/Morphix.iconset
          mkdir -p "$ICONSET"
          for spec in 16:16x16 32:16x16@2x 32:32x32 64:32x32@2x 128:128x128 256:128x128@2x 256:256x256 512:256x256@2x 512:512x512 1024:512x512@2x; do
            sips -s format png -z "${spec%%:*}" "${spec%%:*}" assets/morphix_logo.png --out "$ICONSET/icon_${spec#*:}.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o build_out/Morphix.icns

      - name: Build Morphix.app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --distpath build_out/dist --workpath build_out/build --specpath build_out --paths "$PWD" \
            --name Morphix --osx-bundle-identifier com.iyousefhub.morphix \
            --collect-all imageio_ffmpeg --collect-all pymupdf \
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime \
            --collect-submodules huggingface_hub --collect-submodules tokenizers \
            --collect-submodules AppKit --collect-submodules Foundation --collect-submodules objc \
            --hidden-import worker_process --hidden-import engine_core --hidden-import transcription_engine \
            --hidden-import hub_panel --hidden-import i18n_ar --hidden-import ui_kit --hidden-import theme \
            --hidden-import docs_engine --hidden-import background_engine --hidden-import background_dialog \
            --collect-submodules openpyxl \
            --add-data "$PWD/assets:assets" --icon "$PWD/build_out/Morphix.icns" "$PWD/main.py"
          APP=build_out/dist/Morphix.app
          test -d "$APP"
          PLIST="$APP/Contents/Info.plist"
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          /usr/libexec/PlistBuddy -c 'Add :LSUIElement bool true' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :NSAppleEventsUsageDescription string Morphix reads the files you select in Finder so it can show the right tools.' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$PLIST" 2>/dev/null || true
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Create the DMG
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          STAGE=build_out/dmg
          mkdir -p "$STAGE"
          ditto build_out/dist/Morphix.app "$STAGE/Morphix.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Morphix -srcfolder "$STAGE" -ov -format UDZO "Morphix_macOS_$VERSION.dmg"
          echo "DMG=Morphix_macOS_$VERSION.dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Morphix_macOS
          path: ${{ env.DMG }}
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Morphix ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: ${{ env.DMG }}
