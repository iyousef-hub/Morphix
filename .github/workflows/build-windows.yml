name: Build Windows

# Builds Morphix.exe on a GitHub-hosted Windows machine, so the Windows
# version can be produced from any computer (including a Mac).
#  - Every push to main and every manual run: a downloadable "Morphix_Windows" artifact.
#  - A tag such as v1.7.1: the zip is also attached to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-speech.txt

      - name: Install components
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-speech.txt "pyinstaller>=6.10,<7" pytest

      - name: Check the speech engine loads
        run: python -c "import av, faster_whisper, ctranslate2; print('speech engine OK')"

      - name: Tests
        # Some tests were written for macOS/Linux; report them without blocking the build.
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build Morphix.exe
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --distpath build_out\dist --workpath build_out\build --specpath build_out --paths "%CD%"
          --name Morphix --icon "%CD%\assets\morphix.ico"
          --collect-all imageio_ffmpeg --collect-all pymupdf
          --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime
          --collect-submodules huggingface_hub --collect-submodules tokenizers --collect-submodules openpyxl
          --hidden-import win32com.client --hidden-import pythoncom --hidden-import pywintypes
          --hidden-import worker_process --hidden-import engine_core --hidden-import transcription_engine
          --hidden-import hub_panel --hidden-import i18n_ar --hidden-import ui_kit --hidden-import win_compat
          --hidden-import docs_engine --hidden-import background_engine --hidden-import background_dialog
          --hidden-import windows_hotkeys --hidden-import theme
          --hidden-import win32gui --hidden-import win32com.shell.shell
          --add-data "%CD%\assets;assets" "%CD%\main.py"

      - name: Smoke test the built app (PDF engine in worker mode)
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path "$work\out" | Out-Null
          python -c "import pymupdf,sys; d=pymupdf.open(); [d.new_page() for _ in range(3)]; d.save(sys.argv[1])" "$work\sample.pdf"
          $req = @{ action = 'pdf_png_zip'; paths = @("$work\sample.pdf"); out_dir = "$work\out"; options = @{} } | ConvertTo-Json -Compress
          Set-Content -Path "$work\req.json" -Value $req -Encoding utf8
          $p = Start-Process -FilePath build_out\dist\Morphix\Morphix.exe -ArgumentList '--morphix-worker', "$work\req.json" -PassThru -Wait
          Get-ChildItem "$work\out" | Format-Table Name, Length
          $log = Join-Path $env:LOCALAPPDATA 'Morphix\logs\morphix.log'
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if (-not (Get-ChildItem "$work\out")) { throw "The built app could not convert a PDF (exit $($p.ExitCode))" }
          Write-Host "Smoke test OK"

      - name: Package
        shell: pwsh
        run: |
          if (-not (Test-Path build_out\dist\Morphix\Morphix.exe)) { throw 'Morphix.exe was not built' }
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path build_out\dist\Morphix -DestinationPath "Morphix_Windows_$version.zip" -Force
          "ZIP=Morphix_Windows_$version.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: Morphix_Windows
          path: build_out/dist/Morphix
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ env.ZIP }}
          retention-days: 7

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Morphix ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: ${{ env.ZIP }}
