name: Build Windows

# Builds Morphix.exe on a GitHub-hosted Windows machine, so the Windows
# version can be produced from any computer (including a Mac).
#  - Every push to main and every manual run: a downloadable "Morphix_Windows" artifact.
#  - A tag such as v1.7.1: the zip is also attached to a GitHub Release.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-speech.txt

      - name: Install components
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-speech.txt "pyinstaller>=6.10,<7" pytest

      - name: Check the speech engine loads
        run: python -c "import av, faster_whisper, ctranslate2; print('speech engine OK')"

      - name: Tests
        # Some tests were written for macOS/Linux; report them without blocking the build.
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build Morphix.exe
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --distpath build_out\dist --workpath build_out\build --specpath build_out --paths "%CD%"
          --name Morphix --icon "%CD%\assets\morphix.ico"
          --collect-all imageio_ffmpeg --collect-all pymupdf
          --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime --collect-all rapidocr --collect-all pillow_heif --collect-all pdf2docx --collect-all docx --collect-all bidi --hidden-import cv2
          --collect-submodules huggingface_hub --collect-submodules tokenizers --collect-submodules openpyxl
          --hidden-import win32com.client --hidden-import pythoncom --hidden-import pywintypes
          --hidden-import worker_process --hidden-import engine_core --hidden-import transcription_engine
          --hidden-import hub_panel --hidden-import i18n_ar --hidden-import ui_kit --hidden-import win_compat
          --hidden-import tools_engine --hidden-import ocr_models --hidden-import latex_ocr --hidden-import action_dialogs --hidden-import signature_dialog --hidden-import docs_engine --hidden-import background_engine --hidden-import background_dialog
          --hidden-import windows_hotkeys --hidden-import theme --hidden-import ms_office
          --hidden-import win32gui --hidden-import win32com.shell.shell
          --add-data "%CD%\assets;assets" "%CD%\main.py"

      - name: Smoke test the built app (every engine, add-on downloads)
        run: python tools/smoke_build.py build_out\dist\Morphix\Morphix.exe --downloads

      - name: Check the windows of the built app (English and Arabic)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'ui'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath build_out\dist\Morphix\Morphix.exe -ArgumentList '--morphix-ui-selftest', "$dir" -PassThru -Wait
          $ok = (Test-Path "$dir\ui_selftest.txt") -and ((Get-Content "$dir\ui_selftest.txt" -Tail 1) -eq 'UI SELFTEST OK')
          if (-not $ok) { python tools/annotate.py "$dir\ui_selftest.txt" "UI self-test (Windows)"; throw "UI self-test failed (exit $($p.ExitCode))" }
          if ($p.ExitCode -ne 0) { Write-Host "::warning::UI self-test passed; exit code $($p.ExitCode) on shutdown" }
          Write-Host "UI self-test OK"

      - name: Package
        shell: pwsh
        run: |
          if (-not (Test-Path build_out\dist\Morphix\Morphix.exe)) { throw 'Morphix.exe was not built' }
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path build_out\dist\Morphix -DestinationPath "Morphix_Windows_$version.zip" -Force
          "ZIP=Morphix_Windows_$version.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: Morphix_Windows
          path: build_out/dist/Morphix
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ env.ZIP }}
          retention-days: 7
