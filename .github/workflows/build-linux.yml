name: Build Linux

# Builds Morphix-<version>-x86_64.AppImage on Ubuntu 22.04 (older glibc, so the
# AppImage also runs on newer distributions).
#  - Every push to main and every manual run: a downloadable artifact.
#  - Called by the Release workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-speech.txt

      - name: System libraries (Qt on X11, bundled into the AppImage)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libegl1 \
            libreoffice-calc-nogui --no-install-recommends

      - name: Install components
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-speech.txt "pyinstaller>=6.10,<7" pytest

      - name: Check the speech engine loads
        run: python -c "import av, faster_whisper, ctranslate2; print('speech engine OK')"

      - name: Tests
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build the AppImage
        env:
          SKIP_PIP: '1'
          PYTHON: python
        run: ./Build_Morphix_Linux.sh

      - name: Smoke test the AppImage (every engine, Office, add-on downloads)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: python tools/smoke_build.py "$(ls $PWD/dist/Morphix-*-x86_64.AppImage)" --office --downloads

      - name: Check the windows of the AppImage (English and Arabic)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          APP=$(ls dist/Morphix-*-x86_64.AppImage)
          "$APP" --morphix-ui-selftest "$RUNNER_TEMP/ui" || { python tools/annotate.py "$RUNNER_TEMP/ui/ui_selftest.txt" "UI self-test (Linux)"; exit 1; }

      - name: Version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/Morphix-${{ env.VERSION }}-x86_64.AppImage
          retention-days: 30
